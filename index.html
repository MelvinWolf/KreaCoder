<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vibe Coding Games</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #14151a; color: #eee;
      display: flex; flex-direction: column; align-items: center;
      padding: 48px 16px; box-sizing: border-box;
    }
    h1 { margin: 0 0 8px; font-size: 2.4rem; }
    p.sub { margin: 0 0 40px; color: #999; }
    .grid {
      display: grid; gap: 20px; width: 100%; max-width: 960px;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    }
    a.card {
      display: block; padding: 24px; border-radius: 14px;
      background: #1f2129; border: 1px solid #2c2f3a;
      color: inherit; text-decoration: none;
      transition: transform .12s, border-color .12s;
    }
    a.card:hover { transform: translateY(-3px); border-color: #6c8cff; }
    .card h2 { margin: 0 0 6px; font-size: 1.25rem; }
    .card span { color: #999; font-size: .9rem; }
  </style>
</head>
<body>
  <h1>Vibe Coding Games</h1>
  <p class="sub">Click a game to play.</p>
  <div class="grid" id="grid"></div>

  <script src="games.js"></script>
  <script>
    var grid = document.getElementById("grid");
    (window.GAMES || []).forEach(function (g) {
      var a = document.createElement("a");
      a.className = "card";
      a.href = "games/" + encodeURIComponent(g.folder) + "/index.html";
      var h = document.createElement("h2");
      h.textContent = g.title;
      var s = document.createElement("span");
      s.textContent = g.team || "";
      a.appendChild(h);
      a.appendChild(s);
      grid.appendChild(a);
    });
  </script>
</body>
</html>
